<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8" />
<title>Navidix Studio — 3D features</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
  body.preview { display: grid; place-items: center; min-height: 100vh; }
  body.preview canvas { max-width: 100vw; max-height: 100vh; width: auto !important; height: auto !important; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script src="audio.js"></script>
<script type="module" src="scene.js"></script>
<script type="module">
  // index.html?preview plays it live (click once to start, with sound).
  if (new URLSearchParams(location.search).has('preview')) {
    document.body.classList.add('preview');
    const wait = () => window.NVX ? NVX.ready : new Promise(r => setTimeout(() => r(wait()), 50));
    await wait();
    NVX.render(4.2);
    document.addEventListener('click', async () => {
      const buf = await NVX_AUDIO.renderBuffer(NVX);
      const ac = new AudioContext(), src = ac.createBufferSource();
      src.buffer = buf; src.loop = true; src.connect(ac.destination); src.start();
      const t0 = ac.currentTime;
      const loop = () => { NVX.render((ac.currentTime - t0) % NVX.DUR); requestAnimationFrame(loop); };
      loop();
    }, { once: true });
  }
</script>
</body>
</html>
