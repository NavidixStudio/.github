<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8" />
<title>Navidix Studio — 15s</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
  /* Preview mode: fit the canvas into the window. */
  body.preview { display: grid; place-items: center; min-height: 100vh; }
  body.preview canvas { max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="motion.js"></script>
<script src="audio.js"></script>
<script>
  // Open index.html?preview in a browser to watch it play live (click to start with sound).
  if (new URLSearchParams(location.search).has('preview')) {
    document.body.classList.add('preview');
    NVX.ready.then(() => {
      NVX.render(0);
      let start = null, src = null;
      const loop = (now) => {
        if (start === null) start = now;
        const t = ((now - start) / 1000) % NVX.DUR;
        NVX.render(t);
        requestAnimationFrame(loop);
      };
      document.addEventListener('click', async () => {
        if (start !== null) return;
        const buf = await NVX_AUDIO.renderBuffer();
        const ac = new AudioContext();
        src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
        src.connect(ac.destination); src.start();
        requestAnimationFrame(loop);
      });
    });
  }
</script>
</body>
</html>
